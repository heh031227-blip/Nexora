<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101010">
<title>NEXORA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#17120f;--panel:#261d18;--muted:#b7aaa0;--gold:#c6a15b;--white:#fffaf5;--brown:#4b3024}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Arial,sans-serif}
header{padding:22px 18px 15px;position:sticky;top:0;background:#17120fee;backdrop-filter:blur(12px);z-index:3}
.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:5px}
.search{margin-top:17px;width:100%;padding:14px 15px;border:1px solid #49372c;border-radius:13px;background:#261d18;color:#fffaf5;font-size:15px;outline:none}
main{padding:5px 16px 105px}.section-title{font-size:19px;font-weight:800;margin:17px 0 13px}
.categories{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid #574236;color:#ddd;background:#30231c;padding:9px 13px;border-radius:20px}.chip.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:var(--panel);border:1px solid #3b2b22;border-radius:16px;overflow:hidden;position:relative}
.photo{height:132px;background:linear-gradient(140deg,#4b3024,#211814);display:grid;place-items:center;font-size:55px}
.info{padding:11px}.name{font-weight:700;min-height:35px;line-height:1.2}.desc{color:var(--muted);font-size:11px;margin-top:5px;min-height:26px}
.price{color:var(--gold);font-weight:800;font-size:17px;margin:10px 0}
.add{width:100%;border:0;border-radius:10px;padding:10px;background:var(--gold);color:#111;font-weight:800}
.heart{position:absolute;right:9px;top:9px;background:#111c;border:0;border-radius:50%;width:32px;height:32px;color:white;font-size:18px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#211814f5;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:#aaa;font-size:11px;display:grid;gap:4px;justify-items:center}nav button b{font-size:21px;font-weight:400}nav button.active{color:var(--gold)}
.badge{font-size:10px;color:#111;background:var(--gold);border-radius:10px;padding:2px 5px;margin-left:3px}
#toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:11px 16px;border-radius:20px;display:none;z-index:8;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="brand">NEX<span>ORA</span></div>
  <div class="sub">Полезные товары по доступным ценам</div>
  <input id="search" class="search" placeholder="Поиск товаров..." oninput="render()">
</header>
<main>
  <div id="catalog">
    <div class="section-title">Каталог</div>
    <div class="categories" id="categories"></div>
    <div class="grid" id="products"></div>
  </div>
  <div id="favorites" hidden><div class="section-title">Избранное</div><div class="grid" id="favoriteProducts"></div></div>
  <div id="cart" hidden><div class="section-title">Корзина</div><div id="cartItems"></div><div id="cartTotal" style="font-weight:800;margin:18px 0;color:var(--gold)"></div><button class="add" onclick="checkout()">Перейти к оформлению</button></div>
</main>
<nav>
<button class="active" onclick="tab('catalog',this)"><b>⌂</b>Каталог</button>
<button onclick="tab('favorites',this)"><b>♡</b>Избранное</button>
<button onclick="tab('cart',this)"><b>▣</b>Корзина <span id="cartBadge"></span></button>
</nav>
<div id="toast"></div>
<script>
const items=[
{id:1,name:"Электронные часы",desc:"Практичный аксессуар на каждый день",price:1290,emoji:"⌚",cat:"Аксессуары"},
{id:2,name:"Беспроводные наушники",desc:"Компактные наушники для музыки",price:990,emoji:"🎧",cat:"Электроника"},
{id:3,name:"Портативная колонка",desc:"Музыка дома и в поездке",price:1490,emoji:"🔊",cat:"Электроника"},
{id:4,name:"Термокружка",desc:"Для горячих и холодных напитков",price:690,emoji:"🥤",cat:"Для дома"},
{id:5,name:"Сумка через плечо",desc:"Удобная сумка на каждый день",price:890,emoji:"👜",cat:"Аксессуары"},
{id:6,name:"Настольная лампа",desc:"Компактная лампа для рабочего стола",price:1190,emoji:"💡",cat:"Для дома"}
];
let category="Все",favorites=new Set(),cart={};
const cats=["Все","Электроника","Аксессуары","Для дома"];
function money(n){return n.toLocaleString("ru-RU")+" ₽"}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function card(p){return `<article class="product"><button class="heart" onclick="toggleFav(${p.id})">${favorites.has(p.id)?"♥":"♡"}</button><div class="photo">${p.emoji}</div><div class="info"><div class="name">${p.name}</div><div class="desc">${p.desc}</div><div class="price">${money(p.price)}</div><button class="add" onclick="addCart(${p.id})">В корзину</button></div></article>`}
function render(){
 document.getElementById("categories").innerHTML=cats.map(c=>`<button class="chip ${c===category?"active":""}" onclick="category='${c}';render()">${c}</button>`).join("");
 let q=document.getElementById("search").value.toLowerCase();
 let filtered=items.filter(p=>(category==="Все"||p.cat===category)&&(p.name+" "+p.desc).toLowerCase().includes(q));
 document.getElementById("products").innerHTML=filtered.length?filtered.map(card).join():'<div class="empty">Ничего не найдено</div>';
 let fav=items.filter(p=>favorites.has(p.id));
 document.getElementById("favoriteProducts").innerHTML=fav.length?fav.map(card).join():'<div class="empty">Пока нет избранных товаров</div>';
 let ids=Object.keys(cart).filter(id=>cart[id]>0);
 document.getElementById("cartItems").innerHTML=ids.length?ids.map(id=>{let p=items.find(x=>x.id==id);return `<div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #333"><span style="font-size:30px">${p.emoji}</span><div style="flex:1"><b>${p.name}</b><div style="color:var(--gold);margin-top:5px">${money(p.price)} × ${cart[id]}</div></div><button class="chip" onclick="changeQty(${id},-1)">−</button><button class="chip" onclick="changeQty(${id},1)">+</button></div>`}).join():'<div class="empty">Корзина пока пустая</div>';
 let total=ids.reduce((s,id)=>s+items.find(p=>p.id==id).price*cart[id],0);
 document.getElementById("cartTotal").textContent=ids.length?"Итого: "+money(total):"";
 let count=ids.reduce((s,id)=>s+cart[id],0);document.getElementById("cartBadge").innerHTML=count?`<span class="badge">${count}</span>`:"";
}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);render()}
function addCart(id){cart[id]=(cart[id]||0)+1;render();toast("Добавлено в корзину")}
function changeQty(id,n){cart[id]+=n;if(cart[id]<=0)delete cart[id];render()}
function tab(which,btn){["catalog","favorites","cart"].forEach(x=>document.getElementById(x).hidden=x!==which);document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.getElementById("search").style.display=which==="catalog"?"block":"none"}
function checkout(){let count=Object.values(cart).reduce((a,b)=>a+b,0);if(!count){toast("Сначала добавь товар в корзину");return}alert("Это демонстрационная версия. Заказы и оплата пока не подключены. Следующим шагом подключим оформление заказа.")}
render();
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script>
</body>
</html>
